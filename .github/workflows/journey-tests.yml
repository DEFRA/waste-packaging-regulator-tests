name: Run Journey Tests on GitHub

permissions:
  id-token: write
  contents: read
  checks: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      fe-ref:
        description: 'waste-packaging-regulators-fe branch/tag/SHA to build and test against'
        required: false
        default: main
  workflow_call:
    inputs:
      fe-ref:
        description: 'waste-packaging-regulators-fe branch/tag/SHA to build and test against'
        required: false
        type: string
        default: main

jobs:
  build:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    steps:
      # Explicit repository/ref — a bare `actions/checkout@v4` here would check
      # out the CALLING repo when this workflow runs via workflow_call, not
      # this one. workflow_call callers reference this workflow as `...@main`
      # and expect main's test suite, so stay pinned to main for that trigger;
      # workflow_dispatch is this repo testing itself, so use the dispatching
      # ref there — otherwise a manual run from a feature branch silently
      # tests main's test code instead of the branch's.
      - name: Checkout waste-packaging-regulator-tests
        uses: actions/checkout@v5
        with:
          repository: DEFRA/waste-packaging-regulator-tests
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}

      - name: Checkout waste-packaging-regulators-fe
        uses: actions/checkout@v5
        with:
          repository: DEFRA/waste-packaging-regulators-fe
          ref: ${{ inputs.fe-ref }}
          path: waste-packaging-regulators-fe
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run install:browsers
        shell: bash

      - name: Docker Login
        uses: DEFRA/cdp-build-action/docker-login@main

      - name: Start app under test (docker compose)
        run: docker compose up --build --wait --wait-timeout 300 waste-packaging-regulators-fe
        shell: bash
        env:
          MOCK_API: true
          MOCK_AUTH: true

      - name: Run journey tests
        env:
          NATION_ID: EN
        run: npm run test:github
        shell: bash

      - name: Stop docker compose
        if: always()
        run: docker compose down
        shell: bash

      - name: Upload Playwright artefacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: journey-test-results
          path: |
            test-results/
            playwright-report/
            allure-results/
