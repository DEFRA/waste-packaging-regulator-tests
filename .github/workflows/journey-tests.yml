name: Run Journey Tests on GitHub

permissions:
  id-token: write
  contents: read
  checks: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      fe-ref:
        description: 'waste-packaging-regulators-fe branch/tag/SHA to build and test against'
        required: false
        default: main
      project:
        description: 'Playwright browser project to run (chrome-mac, chrome-windows, edge-windows)'
        required: false
        default: chrome-mac
  workflow_call:
    inputs:
      fe-ref:
        description: 'waste-packaging-regulators-fe branch/tag/SHA to build and test against'
        required: false
        type: string
        default: main
      project:
        description: 'Playwright browser project to run (chrome-mac, chrome-windows, edge-windows)'
        required: false
        type: string
        default: chrome-mac

jobs:
  build:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    steps:
      # Explicit repository/ref — a bare `actions/checkout@v4` here would check
      # out the CALLING repo when this workflow runs via workflow_call, not
      # this one. workflow_call callers reference this workflow as `...@main`
      # and expect main's test suite, so stay pinned to main for that trigger;
      # workflow_dispatch is this repo testing itself, so use the dispatching
      # ref there — otherwise a manual run from a feature branch silently
      # tests main's test code instead of the branch's.
      - name: Checkout waste-packaging-regulator-tests
        uses: actions/checkout@v5
        with:
          repository: DEFRA/waste-packaging-regulator-tests
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}

      - name: Checkout waste-packaging-regulators-fe
        uses: actions/checkout@v5
        with:
          repository: DEFRA/waste-packaging-regulators-fe
          ref: ${{ inputs.fe-ref }}
          path: waste-packaging-regulators-fe
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium for the auth setup project, plus Chrome and Edge for the
      # browser projects (chrome-mac, chrome-windows, edge-windows) — the
      # accessibility and compatibility steps use them whichever project is
      # selected. --force lets the chrome/msedge channels reinstall over the
      # runner's preinstalled copies.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps --force chromium chrome msedge
        shell: bash

      - name: Docker Login
        uses: DEFRA/cdp-build-action/docker-login@main

      - name: Start app under test (docker compose)
        run: docker compose up --build --wait --wait-timeout 300 waste-packaging-regulators-fe
        shell: bash
        env:
          MOCK_API: true
          MOCK_AUTH: true

      # --output and PLAYWRIGHT_HTML_REPORT keep this step's artifacts and HTML
      # report in their own subfolder — without them the accessibility step
      # below would overwrite this one's playwright-report/index.html, since
      # both write to the same default paths otherwise.
      - name: Run journey tests
        env:
          NATION_ID: EN
          PLAYWRIGHT_HTML_REPORT: playwright-report/journey
        run: npm run test:github -- --project=${{ inputs.project || 'chrome-mac' }} --output=test-results/journey
        shell: bash

      # Reuses the same docker-compose app rather than starting a second job
      # for it — csoc_journey.spec.js is the only spec this profile runs (see
      # playwright.config.js), so it's a quick addition on top of the suite
      # above rather than a second full test run. Own output/report
      # subfolder for the same reason as the journey step above;
      # allure-results/ is left shared on purpose so `npm run report` combines
      # both suites, and accessibility-assessment.html is a uniquely named
      # file (utils/accessibility-reporter.js) so it never collided anyway.
      - name: Run accessibility tests
        if: always()
        env:
          NATION_ID: EN
          PLAYWRIGHT_HTML_REPORT: playwright-report/accessibility
        # The accessibility profile only allows some projects (see
        # PROFILE_PROJECTS in playwright.config.js); others fall back to chrome-mac.
        run: npm run test:github:accessibility -- --project=${{ contains(fromJSON('["chrome-mac","edge-windows"]'), inputs.project) && inputs.project || 'chrome-mac' }} --output=test-results/accessibility
        shell: bash

      # Cross-browser run of csoc_journey.spec.js on the compatibility
      # profile's projects (chrome-windows, edge-windows). Plain Playwright on
      # the Linux runner's Chrome and Edge, not BrowserStack — so these are the
      # Linux builds of each browser, not real Windows. Own output/report
      # subfolder for the same reason as the steps above.
      - name: Run compatibility tests
        if: always()
        env:
          NATION_ID: EN
          PLAYWRIGHT_HTML_REPORT: playwright-report/compatibility
        run: npm run test:github:cross-browser -- --output=test-results/compatibility
        shell: bash

      - name: Stop docker compose
        if: always()
        run: docker compose down
        shell: bash

      # Combines every step's allure-results/ into one self-contained
      # allure-report/index.html (npm run report uses --single-file), so the
      # artefact can be opened directly in a browser.
      - name: Generate Allure report
        if: always()
        run: npm run report
        shell: bash

      # test-results/ is left out: the Playwright HTML reports already embed
      # each test's trace and failure screenshot.
      - name: Upload Playwright artefacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: journey-test-results
          path: |
            playwright-report/
            allure-report/
